<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="hugertest.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="actualcode3.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="joinstyling.css" />
    <title>Monastery Showdown</title>
  </head>
  <body>
    <div id="room-badge">
      <span id="room-badge-label">Room</span>
      <span id="change">···</span>
      <button id="qr-btn" onclick="openQRPopup()">QR</button>
    </div>

    <div id="myDIV" hidden>Joined a Room!</div>
    <div id="activation-flash" style="display: none;"></div>

    <div id="box">
      <div id="titles">
        <div id="player-thing" style="display: none;" class="full-span">
          <div id="role-display" style="display: block; align-items: center; justify-content: center;">
            <span id="role-text">You are... </span>
            <img id="guy" src="hehebadguy.png" style="width: 70px; vertical-align: middle;">
          </div>
          <div id="role-target">Your target is...</div>
        </div>
        <div id="timer-display" style="display: none;">30</div>

        <div id="round-display" class="full-span"></div>

        <div id="player-box" class="full-span">
          <div id="player-count">Players
            <div id="player-list">...</div>
          </div>
        </div>

        <!-- Suspicion section -->
        <div id="suspicion-section" style="display: none;" class="full-span">
          <div id="my-suspicion-label">No suspicion</div>
          <div id="suspect-count-label"></div>
          <a onclick="openSuspicionPopup()" class="button">SUSPECT</a>
        </div>

        <!-- Consensus shoot section -->
        <div id="consensus-section" style="display: none;" class="full-span">
          <div id="consensus-label">All Monks agree: ???</div>
          <a id="consensus-shoot-btn" style="display: none;" onclick="monkShoot()" class="button">SHOOT</a>
        </div>

        <!-- Shoot matrix: inactive for Assassin until 3 gun touches, always active for Spy -->
        <div id="shoot-section" style="display: none;" class="full-span">
          <div id="touch-counter"></div>
          <div id="shoot-label">Choose to shoot:</div>
          <div id="shoot-matrix"></div>
        </div>

        <a id="back-btn" href="joinroom.html" onclick="backBtn3()" class="button full-span">BACK</a>
      </div>
    </div>

    <!-- Suspicion popup -->
    <div id="suspicion-popup" style="display: none;">
      <div id="suspicion-popup-inner">
        <div id="suspicion-popup-title">Who do you suspect?</div>
        <div id="suspicion-list"></div>
        <button onclick="closeSuspicionPopup()" class="cancel-btn">Cancel</button>
      </div>
    </div>

    <!-- QR code popup -->
    <div id="qr-popup" style="display: none;">
      <div id="qr-popup-inner">
        <div id="qr-room-label"></div>
        <div id="qr-code"></div>
        <button onclick="closeQRPopup()" class="button">CLOSE</button>
      </div>
    </div>

    <!-- Shot announcement popup -->
    <div id="shot-popup" style="display: none;">
      <div id="shot-popup-inner">
        <div id="shot-name">Player has been Shot!</div>
        <img id="shot-img" src="" style="width: 90px;">
        <div id="shot-role">They were a Monk</div>
        <div id="shot-shooter"></div>
        <div id="shot-target-label"></div>
        <button onclick="closeShotPopup()" class="button">OK</button>
      </div>
    </div>

  </body>
</html>
